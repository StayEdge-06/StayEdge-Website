<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 62.85 57.06" role="img" aria-label="StayEdge mark for purple fields">
  <!--
    StayEdge mark for PURPLE FIELDS ONLY (Brand-Book.pdf p.16, variation 03).
    On Primary Purple #6F2DBD the mark is reduced to the three bars:
    no diamond, no baseline. Shortest bar = Pale Lavender #E8D5F5, others Off-White #FBFBFB.
    Geometry identical to stayedge-icon.svg bars (translated so tallest bar top = y 0).
  -->
  <polygon fill="#FBFBFB" points="50.12,0 62.85,0 44.35,57.06 31.60,57.06"/>
  <polygon fill="#FBFBFB" points="28.60,16.46 41.34,16.46 28.37,56.33 15.62,56.33"/>
  <polygon fill="#E8D5F5" points="8.29,30.75 21.03,30.75 12.74,56.33 0,56.33"/>
</svg>
